<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <title>BPM tapper | Jekyll + Tailwind</title>
    <link rel="stylesheet" href="/assets/css/tailwind.css">
  </head>
  <body class="mx-auto font-mono bg-zinc-300">
    <main class="bg-gray-950 text-white font-sans text-center pt-12 min-h-screen">
  <div id="bpm" class="text-7xl font-bold my-8">—</div>
  <button id="tap" class="w-64 h-64 rounded-full border-0 bg-blue-500 text-white text-3xl font-bold cursor-pointer select-none touch-manipulation active:scale-95 active:bg-blue-600">
    TAP
  </button>
  <br>
  <a href="/setlist"
    class="mt-8 inline-block px-4 py-2 rounded-lg border border-gray-500 border-2 bg-white text-black hover:bg-gray-100 transition">
    Setlist
  </a>
  <script>
    const tapButton = document.getElementById("tap");
    const bpmDisplay = document.getElementById("bpm");
    let taps = [];
    function tap() {
        taps.push(performance.now());
    // Keep only the last 4 taps
    if (taps.length > 4) { taps.shift(); }
    // Need 4 taps to calculate BPM from 3 intervals
    if (taps.length >= 4) {
      let intervals = [];
      for (let i = 1; i < taps.length; i++) {
        intervals.push(taps[i] - taps[i - 1]);
      }
      const averageInterval = intervals.reduce((sum, interval) => sum + interval, 0) / intervals.length;
      const bpm = 60000 / averageInterval;
      bpmDisplay.textContent = Math.round(bpm); }
    };
    tapButton.addEventListener("pointerdown", tap);
  </script>
</main>

  </body>
</html>
