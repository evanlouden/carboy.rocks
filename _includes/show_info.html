<article class="show-row">
  <div class="show-date">
    <span class="show-month">{{ include.month }}</span>
    <span class="show-day">{{ include.day }}</span>
  </div>
  <div>
    <a href="{{ include.venue_url }}" class="show-venue">{{ include.venue_name }}</a>
    <div class="show-meta">
      <div class="show-details">
        {% if include.venue_city %}
          <span>{{ include.venue_city }}</span>
          <span class="show-dot" aria-hidden="true">•</span>
        {% endif %}
        <span class="show-time">{{ include.time }}</span>
      </div>
    </div>
  </div>
</article>
